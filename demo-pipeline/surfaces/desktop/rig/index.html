<!DOCTYPE html><html><head><meta charset="utf-8"><title>driver-test-rig</title><style>
* { margin:0; box-sizing:border-box; font-family:sans-serif; }
body { background:#12161d; color:#e8edf5; height:100vh; display:flex; flex-direction:column; }
#watermark { background:#7a2f2f; color:#fff; text-align:center; padding:6px; font-size:13px; letter-spacing:1px; }
#log { flex:1; overflow-y:auto; padding:24px 18%; }
.msg { margin:14px 0; padding:12px 16px; border-radius:10px; white-space:pre-wrap; line-height:1.5; }
.user { background:#1f2a3a; }
.assistant { background:#1a2028; border:1px solid #2a3648; }
#bar { padding:16px 18%; }
#chat-input { width:100%; min-height:48px; background:#1a2230; color:#e8edf5; border:1px solid #2a3648;
  border-radius:10px; padding:12px; font-size:15px; outline:none; }
</style></head><body>
<div id="watermark">DRIVER TEST RIG — NOT CLAUDE — plumbing smoke-test only</div>
<div id="log"></div>
<div id="bar"><div id="chat-input" contenteditable="true" data-testid="chat-input"></div></div>
<script>
// Mimics only the DOM contract the driver depends on: a contenteditable
// input, assistant messages, and a streaming indicator while "responding".
const CANNED = [
  "Here is your one-minute briefing. Today's meetings: 09:30 stand-up, 11:00 1:1, 14:00 working group. Top 3 priorities: the procurement note (deadline moved to 15:00 — urgent), working-group prep, pilot feedback. Urgent: deadline change from the director's office.",
  "Done — here's a reusable morning briefing prompt. Paste fresh calendar and inbox details each day and it will keep the same three sections: meetings, top 3 priorities, urgent items.",
  "Scheduled: every weekday at 9am your briefing will be ready when you open the app. You can change the schedule any time.",
];
let n = 0;
const log = document.getElementById('log');
const input = document.getElementById('chat-input');
input.addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  e.preventDefault();
  const text = input.innerText.trim();
  if (!text) return;
  input.innerText = '';
  add('user', text);
  const el = add('assistant', '');
  el.setAttribute('data-is-streaming', 'true');
  const reply = CANNED[Math.min(n++, CANNED.length - 1)];
  for (const word of reply.split(' ')) {
    el.textContent += (el.textContent ? ' ' : '') + word;
    log.scrollTop = log.scrollHeight;
    await new Promise(r => setTimeout(r, 60));
  }
  el.removeAttribute('data-is-streaming');
});
function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (cls === 'assistant') d.setAttribute('data-message-author', 'assistant');
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
</script></body></html>
