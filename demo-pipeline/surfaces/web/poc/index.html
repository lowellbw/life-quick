<!DOCTYPE html><html><head><meta charset="utf-8"><title>Claude in the browser — proof-of-concept render</title><style>
* { margin:0; box-sizing:border-box; }
body { font-family:-apple-system, 'Segoe UI', 'DejaVu Sans', sans-serif; background:#1a1915;
  color:#eceae4; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#browserbar { flex:0 0 auto; height:44px; background:#0f0e0c; display:flex; align-items:center;
  gap:10px; padding:0 14px; border-bottom:1px solid #33312b; }
.dot { width:12px; height:12px; border-radius:50%; }
#urlbox { flex:1; max-width:560px; margin:0 auto; background:#26241f; border:1px solid #3d3a32;
  border-radius:18px; padding:6px 16px; font-size:13px; color:#a8a294; text-align:center; }
#urlbox b { color:#d5d0c4; font-weight:500; }
#badge { font-size:11px; color:#c2bdb1; background:#3a3833; border:1px solid #55524a;
  border-radius:20px; padding:3px 10px; }
#app { flex:1 1 0; display:flex; flex-direction:column; background:#262624; overflow:hidden; }
#log { flex:1 1 0; overflow-y:auto; padding:28px 0 16px; }
.row { max-width:760px; margin:0 auto 18px; padding:0 24px; display:flex; }
.user .bubble { margin-left:auto; background:#3b556e; border-radius:14px 14px 4px 14px; }
.assistant .bubble { background:#30302c; border:1px solid #3f3d37; border-radius:14px 14px 14px 4px; }
.bubble { padding:12px 16px; line-height:1.55; font-size:15px; white-space:pre-wrap; max-width:92%; }
.assistant .who { color:#d97757; font-weight:600; font-size:13px; margin:0 0 6px; }
.thinking { color:#9a958a; font-style:italic; }
.thinking::after { content:''; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
#composer { flex:0 0 auto; padding:14px 0 22px; }
#composer-inner { max-width:760px; margin:0 auto; padding:0 24px; }
#chat-input { width:100%; min-height:52px; max-height:120px; overflow-y:auto; background:#30302c;
  color:#eceae4; border:1px solid #4a473f; border-radius:14px; padding:15px 16px; font-size:15px;
  outline:none; line-height:1.4; }
#chat-input:empty::before { content:'Message Claude…'; color:#7d786d; }
#hint { text-align:center; color:#6d685e; font-size:11px; margin-top:10px; }
</style></head><body>
<div id="browserbar">
  <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
  <div id="urlbox">🔒 <b>localhost:8787</b> — local proof-of-concept page</div>
  <span id="badge">responses from real Claude</span>
</div>
<div id="app">
<div id="log"></div>
<div id="composer"><div id="composer-inner">
  <div id="chat-input" contenteditable="true" data-testid="chat-input"></div>
  <div id="hint">Live responses from the authenticated Claude CLI — this page stands in for claude.ai, and says so in the URL bar</div>
</div></div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('chat-input');

function add(cls, text) {
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (cls === 'assistant') {
    row.setAttribute('data-message-author', 'assistant');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'Claude';
    b.appendChild(who);
  }
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  b.appendChild(body);
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

input.addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  e.preventDefault();
  const text = input.innerText.trim();
  if (!text) return;
  input.innerText = '';
  add('user', text);
  const row = add('assistant', '');
  const body = row.querySelector('.body');
  row.setAttribute('data-is-streaming', 'true');
  body.className = 'body thinking';
  body.textContent = 'Claude is thinking';
  const r = await fetch('/ask', { method: 'POST', body: JSON.stringify({ prompt: text }) });
  const { reply } = await r.json();          // ← real Claude, live
  body.className = 'body';
  body.textContent = '';
  for (const word of reply.split(' ')) {
    body.textContent += (body.textContent ? ' ' : '') + word;
    log.scrollTop = log.scrollHeight;
    await new Promise(res => setTimeout(res, 28));
  }
  row.removeAttribute('data-is-streaming');
});
</script></body></html>
